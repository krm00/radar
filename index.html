<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar — hesap takibi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#252a34;--txt:#e6e9ef;--dim:#8b93a1;
        --x:#1d9bf0;--ok:#3ddc84;--red:#ff6b6b;--gold:#f5c451}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
       -webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:10px;
         padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
         border-bottom:1px solid var(--line);position:sticky;top:0;
         background:rgba(15,17,21,.94);backdrop-filter:blur(14px);z-index:9}
  h1{font-size:16px;margin:0;font-weight:650}
  .spacer{flex:1}
  .muted{color:var(--dim);font-size:12px}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);
         border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}
  button:active{transform:translateY(1px)}
  main{max-width:820px;margin:0 auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}

  .acct{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .who{display:flex;gap:12px;align-items:flex-start}
  .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#222732;flex:0 0 auto}
  .nm{font-weight:650;font-size:16px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .badge{color:var(--x);font-size:13px}
  .bio{color:#b9c2d0;font-size:13px;margin-top:6px;white-space:pre-wrap}
  .last{display:flex;align-items:center;gap:7px;margin-top:12px;padding:8px 11px;
        background:#12151b;border:1px solid var(--line);border-left:3px solid var(--x);
        border-radius:10px;font-size:12.5px;color:#c3cad6}
  .last b{color:#fff;font-weight:600}
  .last .ago{color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
  .big{font-size:36px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
  .delta{font-size:13px;padding-bottom:7px}
  .chips{display:flex;gap:6px;padding-bottom:8px;flex-wrap:wrap}
  .chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--dim)}
  .up{color:var(--ok)} .down{color:var(--red)} .flat{color:var(--dim)}
  svg.spark{width:100%;height:52px;margin-top:10px;display:block}
  .stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;
          border-top:1px solid var(--line);padding-top:12px}
  .st{text-align:center}
  .st b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
  .st span{font-size:10.5px;color:var(--dim)}

  .tools{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
  .tools input{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);
               border-radius:9px;padding:8px 11px;color:var(--txt);font-size:13px}
  .tools select{background:var(--card);border:1px solid var(--line);border-radius:9px;
                padding:8px 9px;color:var(--txt);font-size:13px}

  .post{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
        border-radius:16px;padding:15px;margin-bottom:12px}
  .post.original{border-left-color:#3ddc84}
  .post.reply{border-left-color:#1d9bf0}
  .post.quote{border-left-color:#a06bff}
  .post.retweet{border-left-color:#5b6472;opacity:.93}
  .typehdr{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:8px;flex-wrap:wrap}
  .typehdr a{color:#7ab7e8;text-decoration:none}
  .ty{font-weight:600}
  .ty.original{color:#3ddc84} .ty.reply{color:#1d9bf0}
  .ty.quote{color:#a06bff} .ty.retweet{color:#9aa3b2}
  .quoted{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0 0 10px;
          background:#12151b;font-size:13px;color:#c3cad6}
  .quoted b{color:#9fb4cc}
  .quoted a{color:#7ab7e8;text-decoration:none;font-size:11.5px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px;font-size:11.5px;color:var(--dim)}
  .legend i{font-style:normal}
  .pmeta{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .pdate{color:var(--dim);font-size:12px}
  .pill{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 7px}
  .pill.top{color:#241c05;background:var(--gold);border-color:var(--gold);font-weight:600}
  .pill.pin{color:#0b1a10;background:var(--ok);border-color:var(--ok);font-weight:600}
  .ptext{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-bottom:9px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .tag{font-size:11.5px;color:#7ab7e8}
  .media{display:grid;gap:4px;border-radius:12px;overflow:hidden;margin:4px 0 10px}
  .media.n1{grid-template-columns:1fr}
  .media.n2{grid-template-columns:1fr 1fr}
  .media.n3,.media.n4{grid-template-columns:1fr 1fr}
  .media a{display:block;position:relative;background:#101318;aspect-ratio:16/10;overflow:hidden}
  .media.n1 a{aspect-ratio:auto;max-height:420px}
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .media.n1 img{object-fit:contain;background:#0b0d11}
  .play{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;
        color:#fff;text-shadow:0 2px 12px #000;background:rgba(0,0,0,.18)}
  .pstats{display:flex;gap:14px;color:var(--dim);font-size:12.5px;flex-wrap:wrap;align-items:center}
  .pstats b{color:#cdd4e0;font-weight:600;font-variant-numeric:tabular-nums}
  .pstats a{margin-left:auto;color:#7ab7e8;text-decoration:none;font-size:12.5px}
  .mini{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--dim);font-size:11px}
  .mini svg{height:22px;width:120px}

  .analytics{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
  .analytics h2{font-size:13.5px;margin:0 0 12px;font-weight:650;color:#cdd4e0}
  .wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .wk div{background:#12151b;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
  .wk b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .wk span{font-size:10.5px;color:var(--dim)}
  .heat{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;align-items:center;margin:6px 0 14px}
  .heat .d{font-size:9.5px;color:var(--dim);padding-right:4px;white-space:nowrap}
  .cell{aspect-ratio:1;border-radius:2px;background:#1b1f27}
  .cell.h1{background:rgba(61,220,132,.25)} .cell.h2{background:rgba(61,220,132,.5)}
  .cell.h3{background:rgba(61,220,132,.75)} .cell.h4{background:rgba(61,220,132,1)}
  .bars{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .bar{display:grid;grid-template-columns:74px 1fr 56px;gap:8px;align-items:center;font-size:12px}
  .bar .track{background:#12151b;border-radius:6px;height:8px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  .bar em{font-style:normal;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
  .langs{display:flex;gap:6px;flex-wrap:wrap}
  .tr-list{display:flex;flex-direction:column;gap:0}
  .tr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tr:last-child{border-bottom:0}
  .tr a{color:#7ab7e8;text-decoration:none}
  .tr span{color:var(--dim);font-size:11.5px;flex:0 0 auto}
  .conv{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .cmt{padding:6px 0 6px 9px;border-left:2px solid #2a3140;margin:4px 0}
  .cmt.owner{border-left-color:var(--x);background:rgba(29,155,240,.06);border-radius:0 8px 8px 0}
  .cmt-h{font-size:11.5px;color:var(--dim);margin-bottom:2px}
  .cmt-h b{color:#c7d0dd;font-weight:600}
  .cmt-h .own{color:var(--x);font-weight:600}
  .cmt-t{font-size:13px;white-space:pre-wrap;word-break:break-word}
  .cmt-s{font-size:11px;color:var(--dim);margin-top:2px}
  .ask.on{background:#1d3b52;border-color:#2b5f80}
  .events{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
  .events h2,.hist h2{font-size:13.5px;margin:0 0 10px;font-weight:650;color:#cdd4e0}
  .ev{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .ev:last-child{border-bottom:0}
  .ev time{color:var(--dim);flex:0 0 84px;font-variant-numeric:tabular-nums}
  .hist{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .err{color:#ff8080;font-size:13px;margin:10px 0}
  footer{max-width:820px;margin:0 auto;padding:16px 16px 34px;color:var(--dim);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>📡 Radar</h1>
  <span class="spacer"></span>
  <span class="muted" id="updated">yükleniyor…</span>
  <button onclick="render()">Yenile</button>
</header>

<main>
  <div id="errors"></div>
  <div id="app"></div>
</main>
<footer>
  Veriler herkese açık X gönderilerinden, GitHub Actions ile 3 saatte bir güncellenir.
  Etkileşim oranı = (beğeni + yorum + repost + alıntı) / görüntülenme.
</footer>

<script>
const nf = n => (n == null ? "—" : n.toLocaleString("tr-TR"));
const esc = s => (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtDate = s => { if(!s) return ""; const d = new Date(s);
  return d.toLocaleString("tr-TR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); };
const ago = iso => {
  const t = (Date.now() - new Date(iso)) / 1000;
  if(!isFinite(t) || t < 0) return "";
  if(t < 60) return "az önce";
  if(t < 3600) return Math.floor(t/60) + " dk önce";
  if(t < 86400) return Math.floor(t/3600) + " sa önce";
  return Math.floor(t/86400) + " gün önce";
};
const fmtShort = ts => { const d = new Date(ts*1000);
  return d.toLocaleString("tr-TR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); };

let STATE = null, QUERY = "", SORT = "date", FILTER = "all";

function spark(history, w, h){
  w = w || 300; h = h || 52;
  if(!history || history.length < 2) return "";
  const vs = history.map(x => x.v != null ? x.v : x.l);
  const min = Math.min(...vs), max = Math.max(...vs), span = (max-min)||1, P = 3;
  const pts = vs.map((v,i) => `${((i/(vs.length-1))*w).toFixed(1)},${(h-P-((v-min)/span)*(h-2*P)).toFixed(1)}`).join(" ");
  const col = vs[vs.length-1] >= vs[0] ? "#3ddc84" : "#ff6b6b";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function deltaChip(label, v){
  if(v == null) return "";
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "flat");
  return `<span class="chip ${cls}">${label} ${v > 0 ? "+" : ""}${nf(v)}</span>`;
}

function deltaHTML(d){
  if(!d) return `<span class="delta flat">değişim yok</span>`;
  const cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
  return `<span class="delta ${cls}">${d > 0 ? "▲ +" : "▼ "}${nf(Math.abs(d))}</span>`;
}

function mediaHTML(media){
  if(!media || !media.length) return "";
  const n = Math.min(media.length, 4);
  return `<div class="media n${n}">${media.slice(0,4).map(m => {
    const src = m.preview || m.url;
    const play = (m.type === "video" || m.type === "animated_gif") ? `<span class="play">▶</span>` : "";
    return `<a href="${m.url || src}" target="_blank" rel="noopener">
      <img src="${src}" alt="${esc(m.alt).replace(/"/g,"&quot;")}" loading="lazy">${play}</a>`;
  }).join("")}</div>`;
}

const TYPE_META = {
  original: {icon:"✏️", label:"orijinal gönderi", cls:"original"},
  reply:    {icon:"↩︎", label:"yanıt",           cls:"reply"},
  quote:    {icon:"❝", label:"alıntı",          cls:"quote"},
  retweet:  {icon:"🔁", label:"retweet",        cls:"retweet"},
};

function typeHeader(p){
  const t = TYPE_META[p.type] || TYPE_META.original;
  let extra = "";
  if(p.type === "reply" && p.reply_to && p.reply_to.user){
    extra = ` → <a href="https://x.com/${esc(p.reply_to.user)}" target="_blank" rel="noopener">@${esc(p.reply_to.user)}</a>`;
  } else if(p.type === "quote" && p.quote && p.quote.user){
    extra = ` · <a href="https://x.com/${esc(p.quote.user)}" target="_blank" rel="noopener">@${esc(p.quote.user)}</a>`;
  } else if(p.type === "retweet" && p.rt_of){
    extra = ` · <a href="https://x.com/${esc(p.rt_of)}" target="_blank" rel="noopener">@${esc(p.rt_of)}</a> retweetledi`;
  }
  return `<div class="typehdr"><span class="ty ${t.cls}">${t.icon} ${t.label}</span>${extra}</div>`;
}

function quotedBox(p){
  if(p.type === "reply" && p.reply_to && (p.reply_to.text || p.reply_to.id)){
    const who = p.reply_to.user ? `<b>@${esc(p.reply_to.user)}</b> ` : "";
    const txt = p.reply_to.text ? esc(p.reply_to.text) : "(metin yok)";
    const lnk = p.reply_to.id ? `<a href="https://x.com/i/status/${p.reply_to.id}" target="_blank" rel="noopener">yanıtlanan gönderi ↗</a>` : "";
    return `<div class="quoted">${who}${txt}<div style="margin-top:6px">${lnk}</div></div>`;
  }
  if(p.type === "quote" && p.quote){
    const who = p.quote.user ? `<b>@${esc(p.quote.user)}</b> ` : "";
    const txt = p.quote.text ? esc(p.quote.text) : "(metin yok)";
    const lnk = p.quote.id ? `<a href="https://x.com/i/status/${p.quote.id}" target="_blank" rel="noopener">alıntılanan gönderi ↗</a>` : "";
    return `<div class="quoted">${who}${txt}<div style="margin-top:6px">${lnk}</div></div>`;
  }
  return "";
}

function postHTML(p, topId, handle){
  const t = TYPE_META[p.type] || TYPE_META.original;
  const badges = [
    p.pinned ? `<span class="pill pin">sabitlenmiş</span>` : "",
    p.id === topId ? `<span class="pill top">🔥 en çok etkileşim</span>` : "",
    p.lang ? `<span class="pill">${p.lang}</span>` : "",
  ].join("");
  const hashtags = (p.hashtags||[]).map(x => `<span class="tag">#${esc(x)}</span>`).join("");
  const mentions = (p.mentions||[]).map(x => `<span class="tag">@${esc(x)}</span>`).join("");
  const mini = (p.hist && p.hist.length > 1)
    ? `<div class="mini">beğeni seyri ${spark(p.hist, 120, 22)} <span>${nf(p.hist[0].l)} → ${nf(p.hist[p.hist.length-1].l)}</span></div>` : "";
  return `<article class="post ${t.cls}">
    <div class="pmeta"><span class="pdate">${fmtDate(p.created_at)}</span>${badges}</div>
    ${typeHeader(p)}
    <div class="ptext">${esc(p.text)}</div>
    ${quotedBox(p)}
    ${hashtags || mentions ? `<div class="tags">${hashtags}${mentions}</div>` : ""}
    ${mediaHTML(p.media)}
    <div class="pstats">
      <span>♥ <b>${nf(p.likes)}</b></span>
      <span>💬 <b>${nf(p.comments)}</b></span>
      <span>🔁 <b>${nf(p.reposts)}</b></span>
      <span>🔄 <b>${nf(p.quotes)}</b></span>
      ${p.bookmarks ? `<span>🔖 <b>${nf(p.bookmarks)}</b></span>` : ""}
      ${p.impressions ? `<span>👁 <b>${nf(p.impressions)}</b></span>` : ""}
      ${p.er ? `<span>⚡ <b>%${p.er}</b></span>` : ""}
      ${(STATE.conversations || {})[p.id]
        ? `<button class="ask" onclick="toggleConv(this,'${p.id}')">💬 ${((STATE.conversations||{})[p.id].replies||[]).length} yorum</button>`
        : ``}
      <a href="${p.url}" target="_blank" rel="noopener">X'te aç ↗</a>
    </div>
    ${mini}
    ${convHTML(p.id, handle) || ""}
  </article>`;
}

function filteredPosts(a){
  let ps = (a.posts || []).slice();
  if(FILTER !== "all") ps = ps.filter(p => p.type === FILTER);
  if(QUERY){
    const q = QUERY.toLocaleLowerCase("tr");
    ps = ps.filter(p => (p.text||"").toLocaleLowerCase("tr").includes(q)
      || (p.hashtags||[]).some(h => h.toLocaleLowerCase("tr").includes(q)));
  }
  if(SORT === "likes") ps.sort((x,y) => y.likes - x.likes);
  else if(SORT === "engagement") ps.sort((x,y) => (y.engagement||0) - (x.engagement||0));
  else ps.sort((x,y) => new Date(y.created_at) - new Date(x.created_at));
  return ps;
}

function convHTML(postId, handle){
  const c = (STATE.conversations || {})[postId];
  if(!c) return null;
  const items = c.replies || [];
  const byParent = {};
  for(const r of items) (byParent[r.parent] = byParent[r.parent] || []).push(r);
  const render = (parentId, depth) => (byParent[parentId] || []).map(r => {
    const own = ("@" + r.author) === handle;
    const when = r.created_at ? fmtDate(r.created_at) : "";
    return `<div class="cmt${own ? " owner" : ""}">
      <div class="cmt-h">${own ? `<span class="own">↳ ${esc(handle)}</span>` : `<b>@${esc(r.author)}</b>`} · ${when}</div>
      <div class="cmt-t">${esc(r.text)}</div>
      <div class="cmt-s">♥ ${nf(r.likes)}</div>
      ${depth < 3 ? render(r.id, depth + 1) : ""}
    </div>`;
  }).join("");
  const body = render(postId, 0) || `<div class="muted" style="padding:6px 0">Henüz yorum yok.</div>`;
  return `<div class="conv" hidden>${body}</div>`;
}

function toggleConv(btn, id){
  const art = btn.closest(".post");
  const box = art.querySelector(".conv");
  if(!box) return;
  const open = box.hidden;
  box.hidden = !open;
  btn.classList.toggle("on", open);
}

function lastPostHTML(a){
  const ps = (a.posts || []).filter(p => p.created_at);
  if(!ps.length) return `<div class="last">🕒 henüz gönderi yok</div>`;
  const latest = ps.reduce((x,y) => new Date(y.created_at) > new Date(x.created_at) ? y : x);
  const label = {original:"gönderi", reply:"yanıt", quote:"alıntı", retweet:"retweet"}[latest.type] || "gönderi";
  return `<div class="last">🕒 son ${label} <b>${fmtDate(latest.created_at)}</b>
    <span class="ago">${ago(latest.created_at)}</span></div>`;
}

function accountHTML(a){
  const posts = filteredPosts(a);
  return `<section class="acct">
    <div class="who">
      ${a.avatar ? `<img class="avatar" src="${a.avatar}" alt="">` : `<div class="avatar"></div>`}
      <div class="names">
        <div class="nm">${esc(a.name)} ${a.verified ? `<span class="badge">✔︎</span>` : ""}</div>
        <div class="muted">${esc(a.handle)}${a.joined ? " · katılım " + fmtDate(a.joined).split(",")[0] : ""}</div>
        ${a.bio ? `<div class="bio">${esc(a.bio)}</div>` : ""}
      </div>
    </div>
    ${lastPostHTML(a)}
    <div class="row">
      <div class="big">${nf(a.followers)}</div>${deltaHTML(a.delta)}
      <div class="chips">${deltaChip("24s", a.delta_24h)}${deltaChip("7g", a.delta_7d)}</div>
    </div>
    <div class="muted">takipçi</div>
    ${spark(a.history)}
    <div class="stats4">
      <div class="st"><b>${nf(a.following)}</b><span>takip edilen</span></div>
      <div class="st"><b>${nf(a.tweets_total)}</b><span>toplam gönderi</span></div>
      <div class="st"><b>%${nf(a.avg_er)}</b><span>ort. etkileşim</span></div>
      <div class="st"><b>${nf(a.engagement)}</b><span>toplam etkileşim</span></div>
    </div>
  </section>
  <div class="tools">
    <input placeholder="gönderilerde ara…" value="${esc(QUERY)}" oninput="QUERY=this.value;draw()">
    <select onchange="SORT=this.value;draw()">
      <option value="date">tarih</option>
      <option value="likes">beğeni</option>
      <option value="engagement">etkileşim</option>
    </select>
    <select onchange="FILTER=this.value;draw()">
      <option value="all">tümü</option>
      <option value="original">orijinal</option>
      <option value="reply">yanıt</option>
      <option value="quote">alıntı</option>
      <option value="retweet">RT</option>
    </select>
  </div>
  <div class="legend">
    <i><span class="ty original">✏️ orijinal</span></i>
    <i><span class="ty reply">↩︎ yanıt</span></i>
    <i><span class="ty quote">❝ alıntı</span></i>
    <i><span class="ty retweet">🔁 retweet</span></i>
  </div>
  <div class="posts">${posts.map(p => postHTML(p, a.top_post, a.handle)).join("")
    || `<div class="acct muted">Filtreye uyan gönderi yok.</div>`}</div>`;
}

function analyticsHTML(){
  const A = STATE.archive || [];
  if(A.length < 2) return "";
  const now = Date.now()/1000;
  const week = A.filter(p => (Date.parse(p.created_at)/1000) > now - 7*86400);
  const avg = arr => arr.length ? Math.round(arr.reduce((s,x)=>s+x,0)/arr.length) : 0;

  // haftalık özet
  const wkE = avg(week.map(p => p.engagement || 0));
  const wkI = week.reduce((s,p) => s + (p.impressions||0), 0);

  // ısı haritası: gün x saat
  const grid = Array.from({length:7}, () => new Array(24).fill(0));
  for(const p of A){
    const d = new Date(p.created_at);
    if(isNaN(d)) continue;
    grid[(d.getDay()+6)%7][d.getHours()]++;
  }
  const maxC = Math.max(1, ...grid.flat());
  const days = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
  const heat = `<div class="heat"><div class="d"></div>${
      Array.from({length:24},(_,h)=>`<div class="d" style="text-align:center">${h%6===0?h:""}</div>`).join("")}</div>` +
    grid.map((row,i) => `<div class="heat"><div class="d">${days[i]}</div>${
      row.map((c,j) => {
        const b = c ? Math.max(1, Math.ceil((c/maxC)*4)) : 0;
        return `<div class="cell${b ? " h"+b : ""}" title="${days[i]} ${j}:00 · ${c}"></div>`;
      }).join("")}</div>`).join("");

  // tür performansı
  const types = ["original","reply","quote","retweet"];
  const labels = {original:"orijinal", reply:"yanıt", quote:"alıntı", retweet:"retweet"};
  const colors = {original:"#3ddc84", reply:"#1d9bf0", quote:"#a06bff", retweet:"#5b6472"};
  const perf = types.map(t => {
    const ps = A.filter(p => p.type === t);
    return {t, n: ps.length, avg: avg(ps.map(p => p.engagement || 0))};
  }).filter(x => x.n);
  const maxAvg = Math.max(1, ...perf.map(x => x.avg));

  // yanıt verilen hesaplar
  const targets = {};
  for(const p of A) if(p.reply_to) targets[p.reply_to] = (targets[p.reply_to]||0)+1;
  const topTargets = Object.entries(targets).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // diller
  const langs = {};
  for(const p of A) if(p.lang) langs[p.lang] = (langs[p.lang]||0)+1;
  const langChips = Object.entries(langs).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([l,c]) => `<span class="chip">${esc(l)} · ${c}</span>`).join("");

  return `<section class="analytics"><h2>Analiz (${A.length} gönderi arşivi)</h2>
    <div class="wk">
      <div><b>${week.length}</b><span>son 7 gün gönderi</span></div>
      <div><b>${nf(wkE)}</b><span>ort. etkileşim</span></div>
      <div><b>${nf(wkI)}</b><span>haftalık görüntülenme</span></div>
    </div>
    <div class="muted" style="margin-bottom:4px">paylaşım saati (gün × saat)</div>
    ${heat}
    <div class="muted" style="margin-bottom:6px">tür performansı (ort. etkileşim)</div>
    <div class="bars">${perf.map(x => `
      <div class="bar"><span>${labels[x.t]}</span>
        <div class="track"><div class="fill" style="width:${(x.avg/maxAvg*100).toFixed(0)}%;background:${colors[x.t]}"></div></div>
        <em>${nf(x.avg)}</em></div>`).join("")}</div>
    ${topTargets.length ? `<div class="muted" style="margin-bottom:6px">en çok yanıt verdiği hesaplar</div>
      <div class="langs">${topTargets.map(([u,c]) => `<span class="chip">@${esc(u)} · ${c}</span>`).join("")}</div>` : ""}
    ${langChips ? `<div class="muted" style="margin:12px 0 6px">diller</div><div class="langs">${langChips}</div>` : ""}
  </section>`;
}

function trendsHTML(){
  const tr = STATE.trends || [];
  if(!tr.length) return "";
  const rows = tr.slice(0,15).map((t,i) => {
    const q = encodeURIComponent(t.name);
    return `<div class="tr"><a href="https://x.com/search?q=${q}" target="_blank" rel="noopener">${i+1}. ${esc(t.name)}</a></div>`;
  }).join("");
  return `<section class="analytics"><h2>🇹🇷 Gündem</h2><div class="tr-list">${rows}</div></section>`;
}

function eventsHTML(evts){
  if(!evts || !evts.length) return "";
  const rows = evts.slice().reverse().slice(0, 15).map(e => `
    <div class="ev"><time>${fmtShort(e.ts)}</time>
      <span>${esc(e.handle)} ${esc(e.text)}</span></div>`).join("");
  return `<section class="events"><h2>Aktivite</h2>${rows}</section>`;
}

function historyHTML(a){
  const h = (a.history || []).slice(-24).reverse();
  if(h.length < 2) return "";
  const rows = h.map((x,i) => {
    const prev = h[i+1], d = prev ? x.v - prev.v : 0;
    const cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
    return `<tr><td>${fmtShort(x.ts)}</td><td class="${cls}">${d ? (d>0?"+":"") + d : "—"}</td>
      <td>${nf(x.v)}</td></tr>`;
  }).join("");
  return `<section class="hist"><h2>Takipçi geçmişi (son ${h.length})</h2>
    <table><thead><tr><th>zaman</th><th>değişim</th><th>takipçi</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button onclick="csvHistory()">Takipçi CSV</button>
      <button onclick="csvPosts()">Gönderi CSV</button>
    </div></section>`;
}

function dl(name, text){
  const b = new Blob([text], {type:"text/csv;charset=utf-8"});
  const u = URL.createObjectURL(b); const a = document.createElement("a");
  a.href = u; a.download = name; a.click(); URL.revokeObjectURL(u);
}

function csvHistory(){
  if(!STATE) return;
  const L = ["hesap,zaman,takipci"];
  for(const a of STATE.accounts || [])
    for(const h of a.history || []) L.push(`${a.handle},${new Date(h.ts*1000).toISOString()},${h.v}`);
  dl("radar-takipci.csv", L.join("\n"));
}

function csvPosts(){
  if(!STATE) return;
  const L = ["hesap,tarih,tip,begeni,yorum,repost,alinti,goruntulenme,etkilesim,er,metin"];
  for(const a of STATE.accounts || [])
    for(const p of a.posts || []){
      const row = [a.handle, p.created_at, p.type, p.likes, p.comments, p.reposts,
                   p.quotes, p.impressions, p.engagement, p.er,
                   (p.text||"").replace(/"/g,"'").replace(/\n/g," ")];
      L.push('"' + row.join('","') + '"');
    }
  dl("radar-gonderiler.csv", L.join("\n"));
}

function draw(){
  if(!STATE) return;
  document.getElementById("updated").textContent = "son veri " + fmtDate(STATE.updated);
  document.getElementById("app").innerHTML =
    (STATE.accounts || []).map(a => `${accountHTML(a)}${historyHTML(a)}`).join("")
    + analyticsHTML() + trendsHTML() + eventsHTML(STATE.events)
    || `<div class="acct muted">Takip edilen hesap yok.</div>`;
  document.getElementById("errors").innerHTML =
    (STATE.errors || []).map(e => `<div class="err">⚠️ ${esc(e)}</div>`).join("");
}

async function render(){
  try{
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    STATE = await r.json();
    draw();
  }catch(e){
    document.getElementById("errors").innerHTML =
      `<div class="err">Veri yüklenemedi: ${esc(e.message)}</div>`;
  }
}
render();
setInterval(render, 5 * 60 * 1000);
</script>
</body>
</html>
