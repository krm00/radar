<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar — hesap takibi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#252a34;--txt:#e6e9ef;--dim:#8b93a1;
        --x:#1d9bf0;--ok:#3ddc84;--red:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
       -webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:10px;
         padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
         border-bottom:1px solid var(--line);position:sticky;top:0;
         background:rgba(15,17,21,.94);backdrop-filter:blur(14px);z-index:9}
  h1{font-size:16px;margin:0;font-weight:650}
  .spacer{flex:1}
  .muted{color:var(--dim);font-size:12px}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);
         border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}
  button:active{transform:translateY(1px)}
  main{max-width:820px;margin:0 auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}

  .acct{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .who{display:flex;gap:12px;align-items:flex-start}
  .avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#222732;flex:0 0 auto}
  .names{min-width:0;flex:1}
  .nm{font-weight:650;font-size:16px;display:flex;align-items:center;gap:5px}
  .badge{color:var(--x);font-size:13px}
  .bio{color:#b9c2d0;font-size:13px;margin-top:6px;white-space:pre-wrap}
  .row{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
  .big{font-size:36px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
  .delta{font-size:13px;padding-bottom:7px}
  .up{color:var(--ok)} .down{color:var(--red)} .flat{color:var(--dim)}
  svg.spark{width:100%;height:52px;margin-top:10px;display:block}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;
          border-top:1px solid var(--line);padding-top:12px}
  .st{text-align:center}
  .st b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .st span{font-size:11px;color:var(--dim)}

  .posts{display:flex;flex-direction:column;gap:14px}
  .post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}
  .pmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pdate{color:var(--dim);font-size:12px}
  .pill{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 7px}
  .ptext{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
  .media{display:grid;gap:4px;border-radius:12px;overflow:hidden;margin:4px 0 10px}
  .media.n1{grid-template-columns:1fr}
  .media.n2{grid-template-columns:1fr 1fr}
  .media.n3,.media.n4{grid-template-columns:1fr 1fr}
  .media a{display:block;position:relative;background:#101318;aspect-ratio:16/10;overflow:hidden}
  .media.n1 a{aspect-ratio:auto;max-height:420px}
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .media.n1 img{object-fit:contain;background:#0b0d11}
  .play{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;
        color:#fff;text-shadow:0 2px 12px #000;background:rgba(0,0,0,.18)}
  .pstats{display:flex;gap:15px;color:var(--dim);font-size:12.5px;flex-wrap:wrap;align-items:center}
  .pstats b{color:#cdd4e0;font-weight:600;font-variant-numeric:tabular-nums}
  .pstats a{margin-left:auto;color:#7ab7e8;text-decoration:none;font-size:12.5px}

  .hist{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .hist h2{font-size:13.5px;margin:0 0 10px;font-weight:650;color:#cdd4e0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .err{color:#ff8080;font-size:13px;margin:10px 0}
  footer{max-width:820px;margin:0 auto;padding:0 16px 34px;color:var(--dim);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>📡 Radar</h1>
  <span class="spacer"></span>
  <span class="muted" id="updated">yükleniyor…</span>
  <button onclick="render()">Yenile</button>
</header>

<main>
  <div id="errors"></div>
  <div id="app"></div>
</main>
<footer>
  Veriler herkese açık X gönderilerinden, GitHub Actions ile 3 saatte bir güncellenir.
  Görseller X'in CDN'inden yüklenir; gönderiye dokunarak X'te açabilirsin.
</footer>

<script>
const nf = n => (n == null ? "—" : n.toLocaleString("tr-TR"));
const fmtDate = s => {
  if(!s) return "";
  const d = new Date(s);
  return d.toLocaleString("tr-TR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
};

function spark(history){
  if(!history || history.length < 2) return "";
  const vs = history.map(h => h.v), min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1, W = 300, H = 52, P = 4;
  const pts = vs.map((v,i) => {
    const x = (i/(vs.length-1))*W, y = H-P-((v-min)/span)*(H-2*P);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const col = vs[vs.length-1] >= vs[0] ? "#3ddc84" : "#ff6b6b";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function deltaHTML(d){
  if(!d) return `<span class="delta flat">değişim yok</span>`;
  const cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
  return `<span class="delta ${cls}">${d > 0 ? "▲ +" : "▼ "}${nf(Math.abs(d))}</span>`;
}

function mediaHTML(media){
  if(!media || !media.length) return "";
  const n = Math.min(media.length, 4);
  const items = media.slice(0, 4).map(m => {
    const src = m.preview || m.url;
    const play = (m.type === "video" || m.type === "animated_gif")
      ? `<span class="play">▶</span>` : "";
    return `<a href="${m.url || src}" target="_blank" rel="noopener">
      <img src="${src}" alt="${(m.alt || "").replace(/"/g,"&quot;")}" loading="lazy">${play}</a>`;
  }).join("");
  return `<div class="media n${n}">${items}</div>`;
}

function accountHTML(a){
  return `<section class="acct">
    <div class="who">
      ${a.avatar ? `<img class="avatar" src="${a.avatar}" alt="">` : `<div class="avatar"></div>`}
      <div class="names">
        <div class="nm">${a.name} ${a.verified ? `<span class="badge">✔︎</span>` : ""}</div>
        <div class="muted">${a.handle}</div>
        ${a.bio ? `<div class="bio">${a.bio}</div>` : ""}
      </div>
    </div>
    <div class="row"><div class="big">${nf(a.followers)}</div>${deltaHTML(a.delta)}</div>
    <div class="muted">takipçi</div>
    ${spark(a.history)}
    <div class="stats3">
      <div class="st"><b>${nf(a.following)}</b><span>takip edilen</span></div>
      <div class="st"><b>${nf(a.tweets_total)}</b><span>toplam gönderi</span></div>
      <div class="st"><b>${nf(a.engagement)}</b><span>son gönderi etkileşimi</span></div>
    </div>
  </section>`;
}

function postHTML(p){
  return `<article class="post">
    <div class="pmeta">
      <span class="pdate">${fmtDate(p.created_at)}</span>
      ${p.is_retweet ? `<span class="pill">RT</span>` : ""}
      ${p.lang ? `<span class="pill">${p.lang}</span>` : ""}
    </div>
    <div class="ptext">${p.text}</div>
    ${mediaHTML(p.media)}
    <div class="pstats">
      <span>♥ <b>${nf(p.likes)}</b></span>
      <span>💬 <b>${nf(p.comments)}</b></span>
      <span>🔁 <b>${nf(p.reposts)}</b></span>
      <span>🔄 <b>${nf(p.quotes)}</b></span>
      ${p.impressions ? `<span>👁 <b>${nf(p.impressions)}</b></span>` : ""}
      <a href="${p.url}" target="_blank" rel="noopener">X'te aç ↗</a>
    </div>
  </article>`;
}

function historyHTML(a){
  const h = (a.history || []).slice(-24).reverse();
  if(h.length < 2) return "";
  const rows = h.map((x,i) => {
    const prev = h[i+1];
    const d = prev ? x.v - prev.v : 0;
    const cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
    const sign = d > 0 ? "+" : "";
    return `<tr><td>${fmtDate(new Date(x.ts*1000).toISOString())}</td>
      <td class="${cls}">${d ? sign + d : "—"}</td>
      <td>${nf(x.v)}</td></tr>`;
  }).join("");
  return `<section class="hist">
    <h2>Takipçi geçmişi (son ${h.length} kayıt)</h2>
    <table><thead><tr><th>zaman</th><th>değişim</th><th>takipçi</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div style="margin-top:10px"><button onclick="csv()">CSV indir</button></div>
  </section>`;
}

let LAST = null;

function csv(){
  if(!LAST) return;
  const lines = ["hesap,zaman,takipci"];
  for(const a of LAST.accounts || []){
    for(const h of a.history || []){
      lines.push(`${a.handle},${new Date(h.ts*1000).toISOString()},${h.v}`);
    }
  }
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "radar-takipci.csv"; a.click();
  URL.revokeObjectURL(url);
}

async function render(){
  try{
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    const d = await r.json();
    LAST = d;
    document.getElementById("updated").textContent = "son veri " + fmtDate(d.updated);
    document.getElementById("app").innerHTML = (d.accounts || []).map(a => `
      ${accountHTML(a)}
      <div class="posts">${(a.posts || []).map(postHTML).join("")}</div>
      ${historyHTML(a)}
    `).join("") || `<div class="acct muted">Takip edilen hesap yok.</div>`;
    document.getElementById("errors").innerHTML =
      (d.errors || []).map(e => `<div class="err">⚠️ ${e}</div>`).join("");
  }catch(e){
    document.getElementById("errors").innerHTML =
      `<div class="err">Veri yüklenemedi: ${e.message}</div>`;
  }
}
render();
setInterval(render, 5 * 60 * 1000);
</script>
</body>
</html>
