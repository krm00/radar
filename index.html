<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar — hesap takibi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#252a34;--txt:#e6e9ef;--dim:#8b93a1;
        --x:#1d9bf0;--ok:#3ddc84}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
       -webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:12px;
         padding:calc(16px + env(safe-area-inset-top)) 20px 16px;
         border-bottom:1px solid var(--line);position:sticky;top:0;
         background:rgba(15,17,21,.92);backdrop-filter:blur(12px);z-index:5}
  h1{font-size:17px;margin:0;font-weight:650}
  .spacer{flex:1}
  .muted{color:var(--dim);font-size:12px}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);
         border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer}
  main{max-width:1180px;margin:0 auto;padding:20px 20px calc(30px + env(safe-area-inset-bottom))}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .plat{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--x)}
  .handle{font-weight:600}
  .row{display:flex;align-items:flex-end;gap:10px}
  .big{font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .delta{font-size:13px;padding-bottom:6px}
  .up{color:var(--ok)} .down{color:#ff6b6b} .flat{color:var(--dim)}
  svg.spark{width:100%;height:46px;margin-top:10px;display:block}
  .post{border-top:1px solid var(--line);padding:12px 0}
  .post:first-of-type{border-top:0}
  .ptext{font-size:14px;margin-bottom:7px;white-space:pre-wrap;word-break:break-word}
  .meta{display:flex;gap:14px;color:var(--dim);font-size:12.5px;flex-wrap:wrap;align-items:center}
  .meta a{color:#7ab7e8;text-decoration:none}
  .err{color:#ff8080;font-size:13px;margin:10px 0}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 34px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>📡 Radar</h1>
  <span class="spacer"></span>
  <span class="muted" id="updated">yükleniyor…</span>
  <button onclick="render(true)">Yenile</button>
</header>

<main>
  <div id="errors"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>
  Veriler herkese açık X gönderilerinden, GitHub Actions ile saatte bir güncellenir.
  Beğeni/yorum sayıları post okumasıyla birlikte gelir; yorum metinleri bu statik sürümde gösterilmez.
</footer>

<script>
const nf = n => (n == null ? "—" : n.toLocaleString("tr-TR"));

function spark(history){
  if(!history || history.length < 2) return "";
  const vs = history.map(h => h.v), min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1, W = 300, H = 46, P = 3;
  const pts = vs.map((v,i) => {
    const x = (i/(vs.length-1))*W, y = H-P-((v-min)/span)*(H-2*P);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const col = vs[vs.length-1] >= vs[0] ? "#3ddc84" : "#ff6b6b";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function delta(d){
  if(!d) return `<span class="delta flat">değişim yok</span>`;
  const cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
  return `<span class="delta ${cls}">${d > 0 ? "+" : ""}${nf(d)}</span>`;
}

function card(a){
  return `<section class="card">
    <div class="plat"><span class="dot"></span>
      <span class="handle">${a.name}</span>
      <span class="muted">${a.handle}</span></div>
    <div class="row"><div class="big">${nf(a.followers)}</div>${delta(a.delta)}</div>
    <div class="muted">takipçi</div>
    ${spark(a.history)}
    ${(a.posts||[]).map(p => `
      <div class="post">
        <div class="ptext">${p.text || "(metin yok)"}</div>
        <div class="meta">
          <span>♥ ${nf(p.likes)}</span>
          <span>💬 ${nf(p.comments)}</span>
          <span>🔁 ${nf(p.reposts)}</span>
          ${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">X'te aç</a>` : ""}
        </div>
      </div>`).join("") || `<div class="muted" style="margin-top:12px">Gönderi yok.</div>`}
  </section>`;
}

async function render(force){
  try{
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    const d = await r.json();
    document.getElementById("updated").textContent =
      "son veri " + new Date(d.updated).toLocaleString("tr-TR", {dateStyle:"short", timeStyle:"short"});
    document.getElementById("grid").innerHTML =
      (d.accounts||[]).map(card).join("") || `<div class="card muted">Hesap yok.</div>`;
    document.getElementById("errors").innerHTML =
      (d.errors||[]).map(e => `<div class="err">⚠️ ${e}</div>`).join("");
  }catch(e){
    document.getElementById("errors").innerHTML =
      `<div class="err">Veri yüklenemedi: ${e.message}</div>`;
  }
}
render();
setInterval(() => render(), 5 * 60 * 1000);
</script>
</body>
</html>
